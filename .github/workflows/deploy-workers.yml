name: Deploy Cloudflare Workers

# Mac-free Cloudflare Worker deploys.
#
# Auto-discovers every worker under workers/*/ (a dir is a "worker" if it holds
# a wrangler.toml / wrangler.jsonc / wrangler.json) and runs `wrangler deploy`
# for it. On push to main only the workers whose own paths changed are deployed;
# workflow_dispatch deploys all (or one named worker).
#
# Auth is entirely via the two repo secrets — no Mac, no local wrangler login:
#   CLOUDFLARE_API_TOKEN   (Workers:Edit on the account; Workers Routes:Edit on
#                           the chartrunner.xyz zone for route-bound workers)
#   CLOUDFLARE_ACCOUNT_ID
#
# Adding a new worker = drop it under workers/<name>/ with a wrangler config.
# No workflow edits required; it deploys automatically on the next push.

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Which worker to deploy: "all" or a single dir name under workers/ (e.g. hermes-proxy)'
        required: false
        default: 'all'
        type: string

concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover changed workers
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_targets: ${{ steps.detect.outputs.has_targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can diff push ranges reliably.
          fetch-depth: 0

      - name: Detect worker directories to deploy
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_WORKER: ${{ github.event.inputs.worker }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # All worker dirs = any dir under workers/ holding a wrangler config.
          all_dirs=()
          for cfg in workers/*/wrangler.toml workers/*/wrangler.jsonc workers/*/wrangler.json; do
            d="$(dirname "$cfg")"
            case " ${all_dirs[*]-} " in *" $d "*) ;; *) all_dirs+=("$d") ;; esac
          done

          if [ "${#all_dirs[@]}" -eq 0 ]; then
            echo "No workers found under workers/*/ — nothing to deploy."
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          selected=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "${INPUT_WORKER:-all}" = "all" ] || [ -z "${INPUT_WORKER:-}" ]; then
              selected=("${all_dirs[@]}")
            else
              cand="workers/${INPUT_WORKER}"
              found=0
              for d in "${all_dirs[@]}"; do
                if [ "$d" = "$cand" ]; then selected+=("$d"); found=1; fi
              done
              if [ "$found" -eq 0 ]; then
                echo "::error::Requested worker '$INPUT_WORKER' has no wrangler config under workers/${INPUT_WORKER}/"
                exit 1
              fi
            fi
          else
            # push: deploy only workers whose own paths changed in this range.
            base="$BEFORE_SHA"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse "${AFTER_SHA}^" 2>/dev/null || true)"
            fi
            if [ -z "$base" ]; then
              # No usable base (first commit) — deploy everything.
              changed="$(git ls-files)"
            else
              changed="$(git diff --name-only "$base" "$AFTER_SHA")"
            fi
            for d in "${all_dirs[@]}"; do
              if echo "$changed" | grep -q "^${d}/"; then selected+=("$d"); fi
            done
          fi

          if [ "${#selected[@]}" -eq 0 ]; then
            echo "No changed workers in this push — nothing to deploy."
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Workers to deploy:"; printf '  - %s\n' "${selected[@]}"
          matrix="$(printf '%s\n' "${selected[@]}" \
            | jq -R -s -c 'split("\n") | map(select(length>0)) | map({dir: ., name: (split("/") | last)}) | {include: .}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_targets=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.name }}
    needs: discover
    if: needs.discover.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install worker deps
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json in ${{ matrix.dir }} — wrangler will be fetched by npx."
          fi

      - name: wrangler deploy (${{ matrix.name }})
        working-directory: ${{ matrix.dir }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy
