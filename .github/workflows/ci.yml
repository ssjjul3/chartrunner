name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parse-check:
    name: Parse-check the single-file HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check public/private leakage boundary
        run: node scripts/check_public_leakage.mjs

      - name: Validate every <script> body parses
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('ChartRunner_Prototype.html', 'utf8');
            const re = /<script(?![^>]*\bsrc=)([^>]*)>([\s\S]*?)<\/script>/g;
            let i = 0, m;
            while((m = re.exec(html))){
              i++;
              try { new Function(m[2]); }
              catch(e){
                console.error('FAIL script #' + i + ': ' + e.message);
                process.exit(1);
              }
            }
            console.log('OK: ' + i + ' inline script blocks parsed');
          "

      # v0.9.8e — Removed legacy "in sync with root" check. It dated from when
      # chartrunner-prototype/index.html mirrored the game; today that folder
      # hosts the LANDING PAGE (different file entirely), so the diff always
      # warned. The Pages workflow stages the game at /play/index.html now,
      # not /index.html, so the two files SHOULD differ. See pages.yml:46.
