name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parse-check:
    name: Parse-check the single-file HTML
    runs-on: ubuntu-latest
    steps:
      # Node-Laufzeit der Actions: v4 laeuft auf Node20, das GitHub abkuendigt —
      # im Log stand bereits „being forced to run on Node.js 24". @v5/@v6 machen
      # explizit, was ohnehin passiert.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          # Davon getrennt: welches Node die SCHRITTE benutzen. 22 wie in
          # deploy-workers.yml — Konsistenz, nicht Deprecation.
          node-version: '22'
      - name: Check public/private leakage boundary
        run: node scripts/check_public_leakage.mjs

      - name: Validate every <script> body parses
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('ChartRunner_Prototype.html', 'utf8');
            const re = /<script(?![^>]*\bsrc=)([^>]*)>([\s\S]*?)<\/script>/g;
            let i = 0, m;
            while((m = re.exec(html))){
              i++;
              try { new Function(m[2]); }
              catch(e){
                console.error('FAIL script #' + i + ': ' + e.message);
                process.exit(1);
              }
            }
            console.log('OK: ' + i + ' inline script blocks parsed');
          "

      # Zwei gleichnamige Funktionsdeklarationen im selben Scope
      # kollidieren nicht laut: die spaetere gewinnt, die fruehere ist toter
      # Code. Der Parse-Check oben kann das nicht sehen — die Datei ist gueltig,
      # sie tut nur etwas anderes als dasteht. Anlass: v1.0.874 brachte ein
      # zweites _crFmtSol mit, und die Swap-Tafel benutzte nie den Formatierer,
      # den sie mitgebracht hat. Geprueft wird JEDER Scope — die erste Fassung
      # sah nur die oberste Ebene, und die Datei besteht groesstenteils aus
      # IIFEs. acorn ist eine CI-Abhaengigkeit, keine der Spieldatei — die
      # bleibt Single-File ohne Build-Schritt.
      - name: No duplicate declarations (any scope)
        run: |
          npm i acorn --no-save --silent
          node scripts/check_duplicate_declarations.mjs

      # v0.9.8e — Removed legacy "in sync with root" check. It dated from when
      # chartrunner-prototype/index.html mirrored the game; today that folder
      # hosts the LANDING PAGE (different file entirely), so the diff always
      # warned. The Pages workflow stages the game at /play/index.html now,
      # not /index.html, so the two files SHOULD differ. See pages.yml:46.
