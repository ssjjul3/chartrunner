name: Preview ui-v2 (/play-v2/)

# Jeder Push nach ui-v2 (also jeder Merge eines PRs in diesen Branch) stoesst
# den Pages-Deploy auf main an. pages.yml holt dabei ChartRunner_Prototype.html
# aus ui-v2 und legt es unter /play-v2/ ab; /play/ bleibt, was main ist.
# So muss nach einem Merge nach ui-v2 niemand mehr „Run workflow" tippen.
#
# Bewusst NICHT: pages.yml selbst auf ui-v2 triggern — ein Push dorthin wuerde
# sonst die ganze Seite aus ui-v2 ausrollen. Deployt wird immer von main.
# Diese Datei wirkt nur auf Pushes nach ui-v2; landet sie spaeter in main,
# tut sie dort nichts.

on:
  push:
    branches: [ui-v2]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-pages:
    name: Pages-Deploy auf main anstossen
    runs-on: ubuntu-latest
    steps:
      - name: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
          echo "Pages-Deploy angestossen (main) fuer ui-v2 @ ${GITHUB_SHA::7} — /play-v2/ ist in ~1 Minute aktuell."
