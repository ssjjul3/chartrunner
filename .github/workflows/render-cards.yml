name: render-cards

# Render path (no browser): regenerates og-card.png + cards/*.png from the canvas
# renderer chartrunner-prototype/assets/cr-share-card.js via @napi-rs/canvas.
# Triggers on card-source changes or manually; commits the PNGs with [skip ci].

on:
  push:
    branches: [main]
    paths:
      - 'chartrunner-prototype/assets/cr-share-card.js'
      - '.github/scripts/render-cards.cjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install renderer
        run: npm i @napi-rs/canvas @fontsource/archivo-black @fontsource/jetbrains-mono --no-audit --no-fund
      - name: Render cards
        run: node .github/scripts/render-cards.cjs
      - name: Commit rendered cards
        run: |
          git config user.name "cr-render-bot"
          git config user.email "actions@users.noreply.github.com"
          git add chartrunner-prototype/og-card.png chartrunner-prototype/cards
          if git diff --cached --quiet; then
            echo "No card changes to commit."
          else
            git commit -m "chore(cards): render share cards from source [skip ci]"
            git push
          fi
