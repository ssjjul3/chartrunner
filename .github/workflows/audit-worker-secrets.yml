name: Audit Worker Secrets

# Mac-free `wrangler secret list`.
#
# `wrangler secret list --name <worker>` only shows which secret NAMES exist on
# a worker (never the values), so it is safe to print in a CI log. Use this to
# check which secrets a deployed worker already has vs. which are still missing.
#
# Runs entirely on the two repo secrets (CLOUDFLARE_API_TOKEN + ACCOUNT_ID) — no
# wrangler config needed, so it works for workers whose source lives outside
# this repo too (just pass the exact deployed worker name).
#
# This is a read-only, manually-triggered diagnostic — it never deploys.

on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Space-separated deployed worker names to audit'
        required: true
        default: 'chartrunner-hermes-proxy chartrunner-worker'
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: wrangler secret list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: List secret names per worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS: ${{ github.event.inputs.workers }}
        run: |
          set -uo pipefail
          for w in $WORKERS; do
            echo "::group::secrets on $w"
            # A non-existent worker or a permission gap surfaces here; keep going
            # so one bad name doesn't hide the rest.
            npx --yes wrangler secret list --name "$w" || \
              echo "::warning::could not list secrets for '$w' (worker may not exist yet, or token lacks access)"
            echo "::endgroup::"
          done
