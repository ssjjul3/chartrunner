name: Deploy to GitHub Pages

# Builds three surfaces into one Pages artifact:
#   /                  → ChartRunner prototype landing (chartrunner-prototype/)
#   /play/             → Canonical ChartRunner game (ChartRunner_Prototype.html)
#   /telegram/         → Telegram Mini App (chartrunner-mobile)
#   /solana-connect/   → React + Vite Solana devnet connect

on:
  push:
    branches: [main]
    paths:
      - 'chartrunner-prototype/**'
      - 'ChartRunner_Prototype.html'
      - 'solana-connect/**'
      - 'telegram/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build + deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: solana-connect/package-lock.json

      - name: Stage landing page at /
        run: |
          mkdir -p _site
          # Landing page is the canonical chartrunner-prototype/index.html (NOT the game).
          cp -R chartrunner-prototype/. _site/
          echo "deployed: $(date -u +%Y-%m-%dT%H:%M:%SZ) · sha: ${GITHUB_SHA::7}" \
            > _site/BUILD-INFO

      - name: Stage game at /play/
        run: |
          mkdir -p _site/play
          # The canonical game HTML gets staged into /play/ so the landing keeps the root.
          cp ChartRunner_Prototype.html _site/play/index.html
          # Carry .nojekyll to /play/ too, defensive.
          touch _site/play/.nojekyll

      # ---------------------------------------------------------------------
      # OPTIONAL SURFACES — decoupled from the core deploy.
      # Everything below is best-effort: a broken telegram/ or solana-connect
      # build must NOT block publishing the landing page, roadmap, or /play/.
      # Each optional surface uses continue-on-error + a guarded stage step so
      # the artifact still uploads and deploys with whatever built successfully.
      # ---------------------------------------------------------------------

      - name: Stage Telegram Mini App at /telegram/ (non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p _site/telegram
          # Static Mini App surface.
          # TON Connect manifest expects to resolve at /telegram/tonconnect-manifest.json on this origin.
          cp -R telegram/. _site/telegram/
          touch _site/telegram/.nojekyll
          echo "telegram: staged"

      - name: Build solana-connect (Vite + React) (non-blocking)
        id: solana_build
        working-directory: solana-connect
        continue-on-error: true
        env:
          # v0.9.7 — custom domain (chartrunner.xyz) serves from root, NOT
          # /<repo>/. The previous /chartrunner/solana-connect/ base 404'd
          # the JS bundle when reached via the custom domain (assets path
          # had a /chartrunner/ prefix the domain doesn't expose).
          VITE_BASE: /solana-connect/
        run: |
          npm ci || npm install
          npm run build

      - name: Stage solana-connect at /solana-connect/ (if built)
        run: |
          set -euo pipefail
          if [ -d solana-connect/dist ] && [ -n "$(ls -A solana-connect/dist 2>/dev/null)" ]; then
            mkdir -p _site/solana-connect
            cp -R solana-connect/dist/. _site/solana-connect/
            echo "solana-connect: staged"
          else
            echo "::warning title=solana-connect skipped::Vite build unavailable (build step outcome=${{ steps.solana_build.outcome }}); core deploy continues without /solana-connect/"
          fi

      - name: Verify core surfaces are present (fail deploy only if these are missing)
        run: |
          set -euo pipefail
          # The landing page + roadmap + game are the surfaces the deploy exists
          # to publish. If any of THESE are missing, the deploy is genuinely
          # broken and should fail loudly rather than publish a half-empty site.
          missing=0
          for f in _site/index.html _site/roadmap.html _site/play/index.html; do
            if [ ! -s "$f" ]; then echo "::error::missing core surface: $f"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "Core surfaces OK:"
          ls -1 _site
          echo "--- BUILD-INFO ---"; cat _site/BUILD-INFO || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
