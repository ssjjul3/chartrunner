name: Deploy to GitHub Pages

# Builds two surfaces into one Pages artifact:
#   /                  → ChartRunner prototype (chartrunner-prototype/)
#   /solana-connect/   → React + Vite Solana devnet connect

on:
  push:
    branches: [main]
    paths:
      - 'chartrunner-prototype/**'
      - 'ChartRunner_Prototype.html'
      - 'solana-connect/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build + deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: solana-connect/package-lock.json

      - name: Sync chartrunner-prototype/index.html with the canonical HTML
        run: |
          cp ChartRunner_Prototype.html chartrunner-prototype/index.html
          echo "deployed: $(date -u +%Y-%m-%dT%H:%M:%SZ) · sha: ${GITHUB_SHA::7}" \
            > chartrunner-prototype/BUILD-INFO

      - name: Stage Pages artifact (prototype at /)
        run: |
          mkdir -p _site
          cp -R chartrunner-prototype/. _site/

      - name: Build solana-connect (Vite + React)
        working-directory: solana-connect
        env:
          # Pages serves under /<repo>/solana-connect/, so Vite needs that base.
          VITE_BASE: /${{ github.event.repository.name }}/solana-connect/
        run: |
          npm ci || npm install
          npm run build

      - name: Stage solana-connect at /solana-connect/
        run: |
          mkdir -p _site/solana-connect
          cp -R solana-connect/dist/. _site/solana-connect/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
