name: Deploy to GitHub Pages

# Builds three surfaces into one Pages artifact:
#   /                  → ChartRunner prototype landing (chartrunner-prototype/)
#   /play/             → Canonical ChartRunner game (ChartRunner_Prototype.html)
#   /telegram/         → Telegram Mini App (chartrunner-mobile)
#   /solana-connect/   → React + Vite Solana devnet connect

on:
  push:
    branches: [main]
    paths:
      - 'chartrunner-prototype/**'
      - 'ChartRunner_Prototype.html'
      - 'solana-connect/**'
      - 'telegram/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build + deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: solana-connect/package-lock.json

      - name: Stage landing page at /
        run: |
          mkdir -p _site
          cp -R chartrunner-prototype/. _site/
          echo "deployed: $(date -u +%Y-%m-%dT%H:%M:%SZ) · sha: ${GITHUB_SHA::7}" \
            > _site/BUILD-INFO

      - name: Stage game at /play/
        run: |
          mkdir -p _site/play
          cp ChartRunner_Prototype.html _site/play/index.html
          touch _site/play/.nojekyll

      - name: Stage ui-v2 preview at /play-v2/ (non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin ui-v2
          f=_site/play-v2/index.html
          mkdir -p _site/play-v2
          git show FETCH_HEAD:ChartRunner_Prototype.html > "$f"
          n=$(grep -c '^  if(!_want()) return;$' "$f" || true)
          if [ "$n" != "1" ]; then
            echo "::warning title=play-v2 skipped::Aktivierungszeile in ui-v2 nicht genau einmal gefunden ($n); /play-v2/ wird nicht ausgerollt"
            rm -rf _site/play-v2
            exit 0
          fi
          sed -i "s#^  if(!_want()) return;\$#  if(!_want() \&\& location.pathname.indexOf('/play-v2') !== 0) return;#" "$f"
          grep -q "location.pathname.indexOf('/play-v2') !== 0) return;" "$f"
          sed -i '0,/<head>/s##<head>\n<meta name="robots" content="noindex">#' "$f"
          for asset in cr-world.jpg cr-runstage.jpg; do
            if git cat-file -e "FETCH_HEAD:$asset" 2>/dev/null; then
              git show "FETCH_HEAD:$asset" > "_site/play-v2/$asset"
              echo "play-v2: $asset"
            fi
          done
          sed -i 's#src="cr-world.jpg"#src="/play-v2/cr-world.jpg"#g' "$f"
          sed -i 's#src="cr-runstage.jpg"#src="/play-v2/cr-runstage.jpg"#g' "$f"
          python3 -c "from pathlib import Path; p=Path('_site/play-v2/index.html'); t=p.read_text(encoding='utf-8'); css='<style id=\"cr2-assetfix\">body.cr2.cr2m #cr2MMenu .cr2-world{position:relative!important}body.cr2.cr2m #cr2MMenu .cr2-world img{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important}#win-tokenterm #crTokList .cr-tokrow{align-items:center!important}#win-tokenterm #crTokList .cr-tokrow > div:first-child{display:flex!important;align-items:center!important;justify-content:center!important;overflow:hidden!important;padding:0!important;line-height:0!important}#win-tokenterm #crTokList .cr-tokrow > div:first-child img{width:100%!important;height:100%!important;object-fit:contain!important;object-position:center!important;display:block!important;margin:0!important}</style>'; t = t if 'cr2-assetfix' in t else t.replace('</head>', css+'</head>', 1); p.write_text(t, encoding='utf-8')"
          if ! grep -q 'assets.coincap.io' "$f"; then
            python3 -c "from pathlib import Path; p=Path('_site/play-v2/index.html'); t=p.read_text(encoding='utf-8'); old='      _crTokLogoFromJup(def),\n    ];'; new='      _crTokLogoFromJup(def),\n      (function(){ var tag=String((def&&def.tag)||\\'\\').toLowerCase().replace(/[^a-z0-9]/g,\\'\\'); return (tag&&tag.length<=15)?(\\'https://assets.coincap.io/assets/icons/\\'+tag+\\'@2x.png\\'):\\'\\'; })(),\n    ];'; n=t.count(old); assert n==1, n; p.write_text(t.replace(old, new, 1), encoding='utf-8')"
          fi
          python3 -c "import base64,pathlib; p=pathlib.Path('_site/play-v2/index.html'); t=p.read_text(encoding='utf-8'); b=base64.b64decode('').decode(); t=t if 'cr2-chartfix' in t else t.replace('</body>', b+'</body>', 1); p.write_text(t, encoding='utf-8')"
          python3 -c "import base64,pathlib; p=pathlib.Path('_site/play-v2/index.html'); t=p.read_text(encoding='utf-8'); b=base64.b64decode('').decode(); t=t if 'cr2-profilefix' in t else t.replace('</body>', b+'</body>', 1); p.write_text(t, encoding='utf-8')"
          python3 -c "import base64,pathlib; p=pathlib.Path('_site/play-v2/index.html'); t=p.read_text(encoding='utf-8'); b=base64.b64decode('PHN0eWxlIGlkPSJjcjItaGlkZW1hcCI+CmJvZHkuY3IyLmNyMm0gI2NyVHZUZk1hcCxib2R5LmNyMi5jcjJtICNjclR2T2JqVHJlZXtkaXNwbGF5Om5vbmUhaW1wb3J0YW50fQo8L3N0eWxlPgo=').decode(); t=t if 'cr2-hidemap' in t else t.replace('</body>', b+'</body>', 1); p.write_text(t, encoding='utf-8')"
          python3 -c "import base64,pathlib; p=pathlib.Path('_site/play-v2/index.html'); t=p.read_text(encoding='utf-8'); b=base64.b64decode('').decode(); t=t if 'cr2-tbpack' in t else t.replace('</body>', b+'</body>', 1); p.write_text(t, encoding='utf-8')"
          python3 -c "import base64,pathlib; p=pathlib.Path('_site/play-v2/index.html'); t=p.read_text(encoding='utf-8'); b=base64.b64decode('').decode(); t=t if 'cr2-popjs' in t else t.replace('</body>', b+'</body>', 1); p.write_text(t, encoding='utf-8')"
          touch _site/play-v2/.nojekyll
          echo "play-v2: ui-v2 @ $(git rev-parse --short FETCH_HEAD)" >> _site/BUILD-INFO
          echo "play-v2: staged from ui-v2 @ $(git rev-parse --short FETCH_HEAD)"

      - name: Stage Telegram Mini App at /telegram/ (non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p _site/telegram
          cp -R telegram/. _site/telegram/
          touch _site/telegram/.nojekyll
          echo "telegram: staged"

      - name: Build solana-connect (Vite + React) (non-blocking)
        id: solana_build
        working-directory: solana-connect
        continue-on-error: true
        env:
          VITE_BASE: /solana-connect/
        run: |
          npm ci || npm install
          npm run build

      - name: Stage solana-connect at /solana-connect/ (if built)
        run: |
          set -euo pipefail
          if [ -d solana-connect/dist ] && [ -n "$(ls -A solana-connect/dist 2>/dev/null)" ]; then
            mkdir -p _site/solana-connect
            cp -R solana-connect/dist/. _site/solana-connect/
            echo "solana-connect: staged"
          else
            echo "::warning title=solana-connect skipped::Vite build unavailable (build step outcome=${{ steps.solana_build.outcome }}); core deploy continues without /solana-connect/"
          fi

      - name: Verify core surfaces are present (fail deploy only if these are missing)
        run: |
          set -euo pipefail
          missing=0
          for f in _site/index.html _site/roadmap.html _site/play/index.html; do
            if [ ! -s "$f" ]; then echo "::error::missing core surface: $f"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "Core surfaces OK:"
          ls -1 _site
          echo "--- BUILD-INFO ---"; cat _site/BUILD-INFO || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge Cloudflare cache (chartrunner.xyz)
        if: success()
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_NAME: chartrunner.xyz
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set — cannot purge cache."
            exit 1
          fi
          api="https://api.cloudflare.com/client/v4"
          zone_resp="$(curl -sS -X GET \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${api}/zones?name=${CF_ZONE_NAME}")"
          if [ "$(echo "$zone_resp" | jq -r '.success')" != "true" ]; then
            echo "::error::Zone lookup failed for ${CF_ZONE_NAME}"
            echo "$zone_resp" | jq -r '.errors' || echo "$zone_resp"
            exit 1
          fi
          zone_id="$(echo "$zone_resp" | jq -r '.result[0].id // empty')"
          if [ -z "$zone_id" ]; then
            echo "::error::No zone id resolved for ${CF_ZONE_NAME}"
            exit 1
          fi
          purge_resp="$(curl -sS -X POST \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${api}/zones/${zone_id}/purge_cache" \
            --data '{"purge_everything":true}')"
          if [ "$(echo "$purge_resp" | jq -r '.success')" != "true" ]; then
            echo "::error::Cache purge failed for ${CF_ZONE_NAME}"
            echo "$purge_resp" | jq -r '.errors' || echo "$purge_resp"
            exit 1
          fi
          echo "Cache purged for ${CF_ZONE_NAME} (purge_everything)."
