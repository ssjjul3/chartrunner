[package]
name = "chartrunner-progression"
version = "0.1.0"
description = "ChartRunner — in-house $RUN mint + $CHART→$RUN conversion valve + licensed-agent-market. Fixed 100M supply, reserve-backed conversion with a reserve-level float, and the T5 anti-sybil $RUN permission sinks (map licences, bot read fees, copytrade fees, agent certification/monthly licence). SCAFFOLD — audit-gated (M0.5), mainnet-gated (M10)."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chartrunner_progression"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# idl-build must pull in anchor-spl's idl-build too, since this program uses
# SPL token accounts (Mint / TokenAccount) in its Accounts structs.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
# anchor-spl is REQUIRED here (unlike the registry): this program mints, burns,
# and transfers the in-house $RUN SPL token. Pinned to the same 0.30.1 line as
# anchor-lang so the token CPI types line up with the Anchor runtime.
anchor-spl = "0.30.1"
solana-program = "=1.18.17"
