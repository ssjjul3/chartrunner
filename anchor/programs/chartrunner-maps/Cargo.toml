[package]
name = "chartrunner-maps"
version = "0.1.0"
description = "ChartRunner — on-chain map index. Stores (name, content_hash, saved_at) for each map a player saves from the game."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chartrunner_maps"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
