[package]
name = "chartrunner-maps"
version = "0.1.0"
description = "ChartRunner — on-chain map index. Stores (name, content_hash, saved_at) for each map a player saves from the game."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chartrunner_maps"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
# Pin transitive solana-program to 1.18.17 — newer 1.18.26 pulls block-buffer
# 0.12.0 which requires Rust edition2024 (needs Rust 1.85+). Anchor 0.30.1's
# expected Rust is 1.79, so we lock the dep tree to versions that compile.
solana-program = "=1.18.17"
