[package]
name = "chartrunner-registry"
version = "0.1.0"
description = "ChartRunner — multi-entity on-chain registry + marketplace. Stores hashes of every player-created artifact (maps, strategies, bots, indicators, backtests, apps, token-profiles, widgets, tools), and handles list/buy/cancel for the P2P marketplace."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chartrunner_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
solana-program = "=1.18.17"
