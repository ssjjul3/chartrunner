[package]
name = "chartrunner-oracle"
version = "0.1.0"
description = "ChartRunner — verifiable price-feed primitive backed by Pyth Core (pull oracle)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chartrunner_oracle"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# v0.9.11 — Pyth Core (pull oracle) integration. Anchor matches the
# version used by chartrunner-match (0.32.1) so the workspace can move
# to a single Anchor version on the next deploy. The receiver SDK is
# the on-chain side of Pyth's pull-oracle architecture: clients post a
# price-update VAA to a PriceUpdateV2 account, then this program reads
# from that account in the same transaction.
#
# References:
#   docs.pyth.network/price-feeds/use-real-time-data/solana
#   github.com/pyth-network/pyth-crosschain (pyth-solana-receiver-sdk)
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
pyth-solana-receiver-sdk = "0.6.1"
