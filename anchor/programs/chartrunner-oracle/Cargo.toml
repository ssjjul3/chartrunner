[package]
name = "chartrunner-oracle"
version = "0.1.0"
description = "ChartRunner — verifiable price-feed primitive backed by Pyth Core (pull oracle)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chartrunner_oracle"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# 2026-06-16 — MOVED OFF Solana Playground to a LOCAL build, and re-pinned from
# Anchor 0.32.1 → 0.30.1. Two reasons:
#   1. Playground can't host this program at all (no pyth-solana-receiver-sdk in
#      its crate list; Playground ships anchor-lang 0.29). The deployed binary was
#      therefore the no-SDK `lib.playground.rs` stub. The REAL program (this
#      lib.rs) only builds locally.
#   2. pyth-solana-receiver-sdk targets anchor 0.28–0.31.1 + solana-program <2.0
#      — it never supported 0.32, so the old 0.32.1/0.6.1 pins could not compile.
# Pinning to 0.30.1 also aligns the oracle with maps + registry (one toolchain);
# only chartrunner_match still needs 0.32.1.
#
# References:
#   docs.pyth.network/price-feeds/use-real-time-data/solana
#   github.com/pyth-network/pyth-crosschain (pyth-solana-receiver-sdk)
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
# 0.4.0 = newest pyth receiver SDK still pinning solana-program >=1.16,<2.0 and
# anchor >=0.28 (verified on crates.io 2026-06-16) → compatible with anchor
# 0.30.1 + the solana-program =1.18.17 pin below. The APIs lib.rs uses
# (PriceUpdateV2, get_price_no_older_than, get_feed_id_from_hex) are stable since
# 0.3.x. If the build surfaces a minor API drift, that's the only thing to nudge.
pyth-solana-receiver-sdk = "0.4.0"
# Match maps/registry: pin solana-program to the Rust-1.79-compatible 1.18.17
# (newer 1.18.26 pulls block-buffer 0.12 which needs edition2024 / Rust 1.85).
solana-program = "=1.18.17"
