[package]
name = "chartrunner-match"
version = "0.1.0"
description = "ChartRunner realtime-multiplayer match-state primitive (MagicBlock Ephemeral Rollups)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chartrunner_match"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
# v0.9.9 — Anchor + ephemeral-rollups-sdk pinned to versions verified
# against the magicblock-engine-examples / anchor-counter sample. Note: this
# is Anchor 0.32.1, NEWER than the 0.30.1 used by chartrunner_maps and
# chartrunner_registry. Plan to upgrade those two as well during the v0.9.9
# match-program deploy so the workspace stays on a single Anchor version.
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
# v0.9.16 — Bumped from 0.11.1 to 0.13.0. 0.11.x has type-mismatch
# errors against the current Solana SDK (`__Pubkey` vs.
# `magicblock_magic_program_api::Pubkey` from two solana-pubkey
# versions in the dep tree). 0.13.0 was published after the
# solana-pubkey v3.0 split and resolves cleanly.
ephemeral-rollups-sdk = { version = "0.13.0", features = ["anchor", "disable-realloc"] }
