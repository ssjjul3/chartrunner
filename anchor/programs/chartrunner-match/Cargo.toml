[package]
name = "chartrunner-match"
version = "0.1.0"
description = "ChartRunner realtime-multiplayer match-state primitive (MagicBlock Ephemeral Rollups)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chartrunner_match"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
# v0.9.9 — Anchor + ephemeral-rollups-sdk pinned to versions verified
# against the magicblock-engine-examples / anchor-counter sample. Note: this
# is Anchor 0.32.1, NEWER than the 0.30.1 used by chartrunner_maps and
# chartrunner_registry. Plan to upgrade those two as well during the v0.9.9
# match-program deploy so the workspace stays on a single Anchor version.
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.11.1", features = ["anchor", "disable-realloc"] }
