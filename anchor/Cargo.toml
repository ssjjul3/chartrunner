[workspace]
# Verified-build workspace — the Anchor 0.30.1 / Rust ~1.79 programs only.
#
# `chartrunner_match` (Anchor 0.32.1 / Rust 1.85, MagicBlock ephemeral-rollups)
# and `chartrunner_oracle` (pyth-solana-receiver-sdk, which drags the Solana 2.x
# split crates — solana-address/solana-pubkey — that require Rust edition2024)
# are EXCLUDED: they cannot resolve or build under the pinned solana-verify image
# for the 0.30.1 programs. `cargo metadata` resolves the WHOLE workspace, so a
# single edition2024-requiring member breaks the deterministic build for ALL
# members. Keeping this workspace uniformly 0.30.1 is exactly the cleanup
# recommended in TOOLCHAINS.md. Build match/oracle from their own toolchain.
#
# Do NOT add `programs/*` back as a glob, and do NOT run a bare `cargo update`
# here: the committed Cargo.lock pins a handful of transitive crates DOWN to
# their last edition2021-compatible versions (blake3 1.8.2, proc-macro-crate
# 3.3.0, indexmap 2.11.4, jobserver 0.1.32). Newer releases moved to
# Rust edition2024, which the pinned build image (Rust ~1.75/1.79) cannot parse.
# See BUILD_VERIFY.md for the full rationale.
members = [
    "programs/chartrunner-maps",
    "programs/chartrunner-registry",
    "programs/chartrunner-progression",
]
exclude = [
    "programs/chartrunner-match",
    "programs/chartrunner-oracle",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
