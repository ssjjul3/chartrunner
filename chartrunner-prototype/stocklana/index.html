<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChartRunner Stocks · Stocklana</title>
<meta name="description" content="Play tokenized stocks as a game: pick an xStock or pre-IPO token (PreStocks, Tessera) and run its real Solana chart in ChartRunner. 24/7, no sign-up. Built for the Stocklana hackathon.">
<meta property="og:title" content="ChartRunner Stocks - run the tape of tokenized stocks">
<meta property="og:description" content="Pick a tokenized stock, run its real Solana chart in ChartRunner. 24/7. Built for Stocklana.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://chartrunner.xyz/stocklana/">
<meta property="og:image" content="https://chartrunner.xyz/og-card.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@ChartRunner_xyz">
<meta name="twitter:image" content="https://chartrunner.xyz/og-card.png">
<link rel="canonical" href="https://chartrunner.xyz/stocklana/">
<style>
:root{--bg:#0e1218;--fg:#e8eef5;--dim:rgba(232,238,245,.55);--acc:#2ee88f;--acc-d:rgba(46,232,143,.14);--line:rgba(255,255,255,.14);
  --mono:"DejaVu Sans Mono","Liberation Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{color:var(--fg);font-family:var(--sans);min-height:100vh;
  background:
    radial-gradient(ellipse at 18% 12%,rgba(255,255,255,.07),transparent 42%),
    linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px) 0 0/64px 64px,
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px) 0 0/64px 64px,
    linear-gradient(135deg,#141922,#0b0e13 70%);
  background-attachment:fixed}
.menubar{position:sticky;top:0;z-index:20;height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  background:#0a0d12;border-bottom:1px solid rgba(255,255,255,.12);font-size:12px}
.menubar a{color:var(--fg);text-decoration:none}
.menubar nav{display:flex;gap:16px}
.menubar .os{font-weight:700;color:rgba(232,238,245,.28)}
.desk{padding:16px 18px 340px;max-width:1200px}
.group{font-family:var(--mono);font-size:11px;color:var(--acc);letter-spacing:.08em;text-transform:uppercase;margin:14px 4px 10px}
.icons{display:grid;grid-template-columns:repeat(auto-fill,84px);gap:14px 0}
.ico{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--fg);width:84px;padding:2px 0;border-radius:6px;-webkit-tap-highlight-color:transparent}
.ico .box{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:-.2px;color:#fff;position:relative;transition:transform .12s,border-color .12s,box-shadow .12s}
.ico .box::after{content:"";position:absolute;left:9px;right:9px;bottom:9px;height:2px;border-radius:2px;background:rgba(255,255,255,.35)}
.ico .box.pre{color:#d7c6ff}
.ico .box.tes{color:#9fe9ff}
.ico .lbl{font-size:12px;font-weight:700;text-align:center;line-height:1.15;text-shadow:0 1px 2px #000}
.ico .sub{font-size:10px;color:var(--dim);margin-top:-4px;text-align:center}
.ico:hover .box,.ico:focus .box{transform:translateY(-2px);border-color:var(--acc);box-shadow:0 0 14px rgba(46,232,143,.35)}
.ico.wait{opacity:.45;pointer-events:none}
.win{position:fixed;right:22px;bottom:18px;z-index:30;width:min(380px,calc(100vw - 24px));background:#0a0e13;border:2px solid var(--acc);border-radius:9px;
  box-shadow:0 0 0 1px rgba(46,232,143,.15),0 20px 60px rgba(0,0,0,.6);font-family:var(--mono);color:var(--acc)}
.win[hidden]{display:none}
.win .tb{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid rgba(46,232,143,.35);font-size:11px;font-weight:700}
.win .tb .inv{width:16px;height:11px;background:
  conic-gradient(from 0deg,var(--acc) 0 0) ;clip-path:polygon(15% 0,30% 0,30% 20%,70% 20%,70% 0,85% 0,85% 20%,100% 20%,100% 70%,85% 70%,85% 100%,70% 100%,70% 70%,30% 70%,30% 100%,15% 100%,15% 70%,0 70%,0 20%,15% 20%)}
.win .tb .sp{flex:1}
.win .tb .dot{width:5px;height:5px;border-radius:50%;background:var(--acc);opacity:.6}
.win .x{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;cursor:pointer}
.win .bd{padding:14px 14px 16px;font-size:13px;line-height:1.55}
.win h2{margin:0 0 10px;font-size:14px;letter-spacing:.04em}
.win p{margin:0 0 10px}
.win .go{display:inline-flex;align-items:center;gap:8px;margin-top:4px;padding:10px 16px;border:1px solid var(--acc);border-radius:9px;background:var(--acc-d);color:#fff;font:700 13px var(--mono);letter-spacing:.06em;text-decoration:none;box-shadow:0 0 14px rgba(46,232,143,.25)}
.win .fine{margin-top:12px;font-size:10.5px;color:var(--dim)}
.win .fine a{color:var(--dim)}
.reopen{position:fixed;right:18px;bottom:18px;z-index:29;border:1px solid var(--acc);background:#0a0e13;color:var(--acc);font:700 11px var(--mono);border-radius:8px;padding:8px 10px;cursor:pointer}
.menubar .mkt{font-family:var(--mono);font-size:11px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.mkt .nyse{color:#ffc84a}.mkt .nyse.open{color:var(--acc)}
.mkt .sol{color:var(--acc)}
.mkt .led{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 6px var(--acc);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.ico .box svg{position:absolute;inset:6px 5px 14px 5px;width:calc(100% - 10px);height:calc(100% - 20px)}
.ico .box.live{font-size:0}
.ico .box.live::after{display:none}
.ico .box .tg{position:absolute;left:0;right:0;bottom:3px;font-size:8.5px;text-align:center;color:rgba(255,255,255,.75)}
.ico .px{font:10px var(--mono);margin-top:-4px;text-align:center}
.up{color:#2ee88f}.dn{color:#ff4d6a}
.win .typed::after{content:"▋";animation:blink 1s infinite;margin-left:1px}
.win .gap{font-size:12px;border-top:1px dashed rgba(46,232,143,.35);padding-top:8px;margin-top:8px;color:var(--fg)}
@media (max-width:600px){.menubar nav a:nth-child(3){display:none}.mkt .sol{display:none}}
.runwin{position:fixed;left:24px;right:24px;top:40px;bottom:18px;z-index:40;display:flex;flex-direction:column;background:#0a0e13;border:2px solid var(--acc);border-radius:9px;box-shadow:0 30px 90px rgba(0,0,0,.75);overflow:hidden}
.runwin[hidden]{display:none}
.runwin .tb{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid rgba(46,232,143,.35);font:700 11px var(--mono);color:var(--acc)}
.runwin .tb .sp{flex:1}
.runwin .tb a{color:var(--fg);font-weight:400;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.runwin .tb button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.runwin iframe{flex:1;width:100%;border:0;background:#0b0e13}
@media (max-width:600px){.runwin{left:0;right:0;top:24px;bottom:0;border-radius:0;border-width:2px 0 0}}
@media (max-width:600px){
  .menubar{padding:0 12px}.menubar nav{gap:12px}
  .desk{padding:14px 10px 360px}
  .icons{grid-template-columns:repeat(4,1fr)}
  .ico{width:auto}
  .win{left:0;right:0;bottom:0;width:100%;border-radius:9px 9px 0 0;border-bottom:0}
}
</style>
</head>
<body>
  <div class="menubar">
    <nav><a href="https://chartrunner.xyz/">Home</a><a href="https://chartrunner.xyz/play/">Play</a><a href="#" id="about">Stocklana</a></nav>
    <span class="mkt" id="mkt"><span class="nyse" id="nyse">NYSE …</span><span class="sol"><span class="led"></span> SOLANA LIVE</span></span>
  </div>

  <main class="desk">
    <div class="group">&gt; xstocks · us equities</div>
    <div class="icons" id="xGrid"></div>
    <div class="group">&gt; pre-ipo · prestocks + tessera</div>
    <div class="icons" id="pGrid"></div>
  </main>

  <section class="win" id="coach" aria-live="polite">
    <div class="tb"><span class="inv" aria-hidden="true"></span>COACH.llm<span class="sp"></span><span class="dot"></span><button class="x" id="close" aria-label="Close">×</button></div>
    <div class="bd">
      <h2>&gt;_ STOCKS MODE</h2>
      <p id="t1" class="typed"></p>
      <p id="t2"></p>
      <p id="t3"></p>
      <a class="go" id="quick" href="#">PLAY AAPLx ▶</a>
      <div class="gap" id="gap" hidden></div>
      <div class="fine">Not financial advice. Tokenized stocks may not be available where you live. <a href="https://chartrunner.xyz/disclaimer.html">Disclaimer</a> · <a href="https://chartrunner.xyz/impressum.html">Impressum</a> · <span id="ver">stocklana v1.5.0</span></div>
    </div>
  </section>
  <button class="reopen" id="reopen" hidden>COACH.llm</button>
  <section class="runwin" id="runwin" hidden aria-label="Game">
    <div class="tb"><span id="runTitle">RUN</span><span class="sp"></span><a id="runFull" href="#" target="_top">fullscreen ↗</a><button id="runClose" aria-label="Close">×</button></div>
    <iframe id="runFrame" title="ChartRunner" allow="fullscreen; clipboard-write" referrerpolicy="same-origin"></iframe>
  </section>

<script>
(function(){
  "use strict";
  var GT="https://api.geckoterminal.com/api/v2";
  var PLAY="https://chartrunner.xyz/play/?tf=15m&symbol=";
  var X=[["AAPLx","Apple"],["TSLAx","Tesla"],["NVDAx","NVIDIA"],["SPYx","S&P 500"],["QQQx","Nasdaq-100"],["METAx","Meta"],["GOOGLx","Alphabet"],["COINx","Coinbase"],["MSTRx","Strategy"],["AMZNx","Amazon"]];
  // Mints as published by the issuers' own APIs (25.09.2026).
  var P=[["SpaceX","SPACEX","PreStocks","PreANxuXjsy2pvisWWMNB6YaJNzr7681wJJr2rHsfTh"],["OpenAI","OPENAI","PreStocks","PreweJYECqtQwBtpxHL171nL2K6umo692gTm7Q3rpgF"],["Anthropic","ANTHROPIC","PreStocks","Pren1FvFX6J3E4kXhJuCiAD5aDmGEb7qJRncwA8Lkhw"],["Kalshi","KALSHI","PreStocks","PreLWGkkeqG1s4HEfFZSy9moCrJ7btsHuUtfcCeoRua"],["Polymarket","POLYMARKET","PreStocks","Pre8AREmFPtoJFT8mQSXQLh56cwJmM7CFDRuoGBZiUP"],["Anduril","ANDURIL","PreStocks","PresTj4Yc2bAR197Er7wz4UUKSfqt6FryBEdAriBoQB"],["Neuralink","NEURALINK","PreStocks","PrekqLJvJ3qVdXmBGDiexvwUTF4rLFDa6HWS4HJbw9S"],["Figure AI","FIGUREAI","PreStocks","PreZad18qfPtbxNpMtMuAuX2zVpvkEU8DnJx56faCWd"],["SpaceX","T-SpaceX","Tessera","TSPXcLV76s6V2zDiZQ18kBfcbnjaE2ZzNT3ga2Pd99v"],["OpenAI","T-OpenAI","Tessera","oPAiAikWTaFj9RYoRFD35ccfwhnMcB3ThgBZRHSkjTZ"],["Kalshi","T-Kalshi","Tessera","TKLSidmLVt3cqGaaodG8tyRzoANfQwoh67AccjmubeZ"]];
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function num(v){ var n=(v===null||v===undefined||v==="")?NaN:Number(v); return isFinite(n)?n:NaN; }
  function usd(n){ if(!isFinite(n)) return ""; return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:n<1?4:2}); }
  function glyph(sym){ var g=sym.replace(/^T-/,"").replace(/x$/,"").toUpperCase(); return g.length>5?g.slice(0,4):g; }
  function getJSON(u){ return fetch(u,{headers:{accept:"application/json"}}).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }); }

  // ── 1) NYSE clock: regular session 09:30–16:00 America/New_York, Mon–Fri (exchange holidays not modelled)
  function nyParts(d){
    var f=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false});
    var o={}; f.formatToParts(d).forEach(function(p){ o[p.type]=p.value; });
    return {wd:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(o.weekday), m:(Number(o.hour)%24)*60+Number(o.minute)};
  }
  function isOpen(d){ var p=nyParts(d); return p.wd>=1&&p.wd<=5&&p.m>=570&&p.m<960; }
  function nextFlip(now){ // step minute-wise (coarse then fine) until the state changes
    var st=isOpen(now), t=new Date(Math.ceil(now.getTime()/60000)*60000);
    for(var k=0;k<60*24*4 && isOpen(t)===st;k+=15) t=new Date(t.getTime()+15*60000);
    for(var b=0;b<15;b++){ var back=new Date(t.getTime()-60000); if(isOpen(back)===st) break; t=back; }
    return t;
  }
  function clock(){
    var now=new Date(), open=isOpen(now), f=nextFlip(now);
    var when=f.toLocaleString(undefined,{weekday:"short",hour:"2-digit",minute:"2-digit"});
    var el=$("nyse"); el.className="nyse"+(open?" open":"");
    el.textContent= open ? "NYSE OPEN · closes "+when : "NYSE CLOSED · opens "+when;
    return open;
  }
  var nyseOpen=clock(); setInterval(clock,30000);

  // ── 2) icons
  var cells={};  // mint -> {el, sym}
  function icon(sym,sub,kind,mint){
    var a=document.createElement("a"); a.className="ico"+(mint?"":" wait");
    if(mint) a.href=PLAY+encodeURIComponent(mint);
    a.title=sym+" · "+sub;
    a.innerHTML='<span class="box'+(kind==="PreStocks"?" pre":kind==="Tessera"?" tes":"")+'">'+esc(glyph(sym))+'</span><span class="lbl">'+esc(sym)+'</span><span class="sub">'+esc(mint?sub:"resolving…")+'</span><span class="px"></span>';
    if(mint) cells[mint]={el:a,sym:sym};
    return a;
  }
  function setPrice(mint,px,chg){
    var c=cells[mint]; if(!c||!isFinite(px)) return;
    var s=usd(px); if(isFinite(chg)) s+=' <span class="'+(chg>=0?"up":"dn")+'">'+(chg>=0?"+":"")+chg.toFixed(1)+'%</span>';
    c.el.querySelector(".px").innerHTML=s;
  }
  function spark(mint,closes){
    var c=cells[mint]; if(!c||closes.length<4) return;
    var lo=Math.min.apply(null,closes), hi=Math.max.apply(null,closes), n=closes.length, W=38, H=26;
    var pts=closes.map(function(v,i){ return (i/(n-1)*W).toFixed(1)+","+(hi===lo?H/2:(H-(v-lo)/(hi-lo)*H)).toFixed(1); }).join(" ");
    var up=closes[n-1]>=closes[0], col=up?"#2ee88f":"#ff4d6a";
    var box=c.el.querySelector(".box"); box.classList.add("live");
    box.innerHTML='<svg viewBox="0 0 38 26" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="tg">'+esc(glyph(c.sym))+'</span>';
  }
  // throttled queue for sparklines (GeckoTerminal free tier ≈ 30 req/min)
  var q=[], busy=false;
  function enqueue(fn){ q.push(fn); pump(); }
  function pump(){ if(busy||!q.length) return; busy=true; var fn=q.shift(); fn().catch(function(){}).then(function(){ setTimeout(function(){ busy=false; pump(); },2300); }); }
  function loadSpark(mint,pool){
    enqueue(function(){
      return getJSON(GT+"/networks/solana/pools/"+pool+"/ohlcv/hour?aggregate=1&limit=24&currency=usd&token="+mint).then(function(j){
        var l=(j.data&&j.data.attributes&&j.data.attributes.ohlcv_list)||[];
        var closes=l.slice().sort(function(a,b){return a[0]-b[0];}).map(function(r){return num(r[4]);}).filter(isFinite);
        spark(mint,closes);
      });
    });
  }

  var pg=$("pGrid");
  P.forEach(function(p){ pg.appendChild(icon(p[1],p[2]==="Tessera"?p[0]+" · T":p[0],p[2],p[3])); });
  var xg=$("xGrid"), quick=$("quick"), aapl=null;
  quick.href=PLAY+encodeURIComponent(P[0][3]); quick.textContent="PLAY SPACEX ▶";

  // pre-IPO: one call for prices + top pools
  enqueue(function(){
    return getJSON(GT+"/networks/solana/tokens/multi/"+P.map(function(p){return p[3];}).join(",")+"?include=top_pools").then(function(j){
      var pools={}; (j.included||[]).forEach(function(k){ pools[k.id]=k.attributes||{}; });
      (j.data||[]).forEach(function(t){
        var a=t.attributes||{}, tp=t.relationships&&t.relationships.top_pools&&t.relationships.top_pools.data||[];
        var pa=tp.length?pools[tp[0].id]:null;
        var chg=pa&&pa.price_change_percentage?num(pa.price_change_percentage.h24):NaN;
        setPrice(a.address,num(a.price_usd),chg);
        if(pa&&pa.address) loadSpark(a.address,pa.address);
      });
    });
  });

  X.forEach(function(x,i){
    var t=icon(x[0],x[1],"x",null); xg.appendChild(t);
    // Resolve the xStock mint at runtime: exact symbol + Backed's "Xs" mint prefix, deepest pool wins.
    enqueue(function(){
      return getJSON(GT+"/search/pools?network=solana&include=base_token&query="+encodeURIComponent(x[0])).then(function(j){
        var tok={}; (j.included||[]).forEach(function(k){ tok[k.id]=k.attributes||{}; });
        var best=null,bp=null,liq=-1;
        (j.data||[]).forEach(function(p){
          var id=p.relationships&&p.relationships.base_token&&p.relationships.base_token.data&&p.relationships.base_token.data.id;
          var m=id?String(id).replace(/^solana_/,""):"";
          if(m.indexOf("Xs")!==0) return;
          if(String((tok[id]||{}).symbol||"").toLowerCase()!==x[0].toLowerCase()) return;
          var l=num(p.attributes&&p.attributes.reserve_in_usd);
          if(isFinite(l)&&l>liq){liq=l;best=m;bp=p.attributes;}
        });
        if(!best) throw 0;
        xg.replaceChild(icon(x[0],x[1],"x",best),t);
        setPrice(best,num(bp.base_token_price_usd),bp.price_change_percentage?num(bp.price_change_percentage.h24):NaN);
        loadSpark(best,bp.address);
        if(i===0){ aapl=num(bp.base_token_price_usd); quick.href=PLAY+encodeURIComponent(best); quick.textContent="PLAY AAPLx ▶"; showGap(); }
      }).catch(function(){ t.querySelector(".sub").textContent="not found"; });
    });
  });

  // ── 3) COACH.llm types its intro
  var lines=[
    nyseOpen ? "> Wall Street is open right now. On Solana it never closes." : "> Wall Street is closed. On Solana, stocks are still trading.",
    "> Tap a stock icon. You drop into a run on its real on-chain candles: bodies are platforms, wicks are hazards.",
    "> Guest play, no sign-up. Connect a wallet in the game and your abilities become real Jupiter trades, signed by you."
  ];
  function type(id,txt,done){
    var el=$(id), k=0; el.className="typed";
    (function tick(){ el.textContent=txt.slice(0,++k); if(k<txt.length) setTimeout(tick,14); else { el.className=""; done&&done(); } })();
  }
  type("t1",lines[0],function(){ type("t2",lines[1],function(){ type("t3",lines[2]); }); });

  // Weekend line: last Nasdaq print needs a source we don't call here, so we only state what we measured.
  function showGap(){
    if(!isFinite(aapl)) return;
    var g=$("gap"); g.hidden=false;
    g.textContent=(nyseOpen?"AAPL trades on NYSE and on Solana right now · AAPLx on-chain ":"NYSE closed · AAPLx still trading on-chain at ")+usd(aapl);
  }

  // ── 4) run the game in a desktop window (same origin), fall back to a normal navigation
  var rw=$("runwin"), rf=$("runFrame");
  function openRun(href,label){
    rf.src=href; $("runFull").href=href; $("runTitle").textContent="▶ RUN · "+label+" · 15m";
    rw.hidden=false; $("coach").hidden=true; $("reopen").hidden=true;
  }
  document.addEventListener("click",function(e){
    var a=e.target.closest&&e.target.closest("a.ico, a#quick"); if(!a||!a.href||a.href.indexOf("/play/")<0) return;
    if(e.metaKey||e.ctrlKey||e.shiftKey) return;
    e.preventDefault();
    var lbl=a.id==="quick"?a.textContent.replace(/^PLAY\s+|\s*▶$/g,""):(a.querySelector(".lbl")||{}).textContent;
    openRun(a.href,lbl||"");
  });
  $("runClose").onclick=function(){ rw.hidden=true; rf.src="about:blank"; $("reopen").hidden=false; };

  var coach=$("coach"), re=$("reopen");
  $("close").onclick=function(){ coach.hidden=true; re.hidden=false; };
  re.onclick=function(){ coach.hidden=false; re.hidden=true; };
  $("about").onclick=function(e){ e.preventDefault(); re.onclick(); };
})();
</script>
</body>
</html>
