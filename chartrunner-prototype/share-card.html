<!doctype html><html><head><meta charset="utf-8"><title>ChartRunner OG share card</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<!-- Canonical OG/Twitter share card. Render to 1200x630 -> og-card.png (site root).
     Also the template for dynamic per-deeplink cards (see docs/SHARE-CARD-INTEGRATION.md). -->
<style>
 :root{--ink:#030504;--paper:#F0EFE6;--signal:#57FF96;--stop:#FF405A;--alert:#FFC84A;--data:#4EE8FF;
   --lime:#84ff5a;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--disp:'Archivo Black','Arial Black',sans-serif}
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{background:#000}
 #card{width:1200px;height:630px;position:relative;overflow:hidden;font-family:var(--mono);color:var(--paper);
   background:radial-gradient(80% 100% at 84% 12%,rgba(87,255,150,.10),transparent 60%),var(--ink)}
 .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(87,255,150,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(87,255,150,.05) 1px,transparent 1px);background-size:46px 46px;-webkit-mask:radial-gradient(130% 120% at 82% 0%,#000,transparent 84%)}
 .nav{position:relative;height:60px;background:#ece9dc;color:#12160f;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-weight:800;font-size:19px}
 .nav .l span{margin-right:22px}
 .nav .r{display:flex;align-items:center;gap:12px}
 .navico{width:42px;height:42px;background:#0b120e;border:1.5px solid var(--signal);border-radius:8px;display:grid;place-items:center;box-shadow:0 0 12px rgba(87,255,150,.4)}
 .navico svg{width:26px;height:19px}
 .body{position:absolute;left:0;right:0;top:60px;bottom:0}
 .L{position:absolute;left:56px;top:70px;width:640px}
 .chip{display:inline-block;border:1.5px solid var(--signal);color:var(--signal);font-weight:700;font-size:14px;letter-spacing:.08em;padding:8px 14px}
 .prompt{color:var(--signal);font-weight:700;font-size:22px;margin-top:20px}
 .hero{font-family:var(--disp);font-size:104px;line-height:.9;text-shadow:5px 6px 0 rgba(0,0,0,.55);margin-top:10px}
 .hero .g{color:var(--signal)}
 .sub{color:#9aa39b;font-size:20px;margin-top:20px;max-width:560px;line-height:1.4}
 .sub b{color:var(--paper);font-weight:400}
 /* invader + candle panel (right) */
 .panel{position:absolute;right:70px;top:120px;width:340px;height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
 .panel .inv{filter:drop-shadow(0 0 16px rgba(87,255,150,.55))}
 .cv{display:flex;align-items:flex-end;gap:12px;height:150px}
 .cx{width:26px;border-radius:2px;position:relative}
 .cx b{position:absolute;left:50%;transform:translateX(-50%);top:-18px;bottom:-18px;width:3px;background:inherit}
 .foot{position:absolute;left:56px;bottom:22px;color:#9aa39b;font-size:15px}
 .rule{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--stop),var(--alert),var(--signal),var(--data))}
</style></head><body>
<div id="card">
 <div class="nav">
   <div class="l"><span>Home</span><span>Tutorial</span><span>Play</span><span>Docs</span><span>Roadmap</span></div>
   <div class="r"><div class="navico"><svg viewBox="0 0 77 56" fill="#57FF96"><rect x="14" width="7" height="7"/><rect x="56" width="7" height="7"/><rect x="21" y="7" width="7" height="7"/><rect x="49" y="7" width="7" height="7"/><rect x="14" y="14" width="49" height="7"/><rect x="7" y="21" width="14" height="7"/><rect x="28" y="21" width="21" height="7"/><rect x="56" y="21" width="14" height="7"/><rect y="28" width="77" height="7"/><rect y="35" width="7" height="7"/><rect x="14" y="35" width="49" height="7"/><rect x="70" y="35" width="7" height="7"/><rect y="42" width="7" height="7"/><rect x="14" y="42" width="7" height="7"/><rect x="56" y="42" width="7" height="7"/><rect x="70" y="42" width="7" height="7"/><rect x="21" y="49" width="14" height="7"/><rect x="42" y="49" width="14" height="7"/></svg></div><span>ChartRunnerOS</span></div>
 </div>
 <div class="body"><div class="grid"></div>
   <div class="L">
     <div class="chip">PRESS PLAY TO RUN THE CHART</div>
     <div class="prompt">&gt; ride the chart _</div>
     <div class="hero">RIDE THE<br><span class="g">CHART.</span></div>
     <div class="sub">Trade the chart. <b>Upside-down.</b> A free trading arcade played on real market candles.</div>
   </div>
   <div class="panel">
     <svg class="inv" width="150" height="110" viewBox="0 0 77 56" fill="#57FF96"><rect x="14" width="7" height="7"/><rect x="56" width="7" height="7"/><rect x="21" y="7" width="7" height="7"/><rect x="49" y="7" width="7" height="7"/><rect x="14" y="14" width="49" height="7"/><rect x="7" y="21" width="14" height="7"/><rect x="28" y="21" width="21" height="7"/><rect x="56" y="21" width="14" height="7"/><rect y="28" width="77" height="7"/><rect y="35" width="7" height="7"/><rect x="14" y="35" width="49" height="7"/><rect x="70" y="35" width="7" height="7"/><rect y="42" width="7" height="7"/><rect x="14" y="42" width="7" height="7"/><rect x="56" y="42" width="7" height="7"/><rect x="70" y="42" width="7" height="7"/><rect x="21" y="49" width="14" height="7"/><rect x="42" y="49" width="14" height="7"/></svg>
     <div class="cv">
       <div class="cx" style="height:96px;background:#ff4d6a"><b></b></div>
       <div class="cx" style="height:64px;background:#84ff5a"><b></b></div>
       <div class="cx" style="height:120px;background:#84ff5a"><b></b></div>
       <div class="cx" style="height:84px;background:#84ff5a"><b></b></div>
       <div class="cx" style="height:132px;background:#84ff5a"><b></b></div>
     </div>
   </div>
   <div class="foot">chartrunner.xyz · free · no sign-up · in-game trades are simulated</div>
   <div class="rule"></div>
 </div>
</div>
</body></html>
