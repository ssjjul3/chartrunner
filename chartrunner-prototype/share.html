<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChartRunner — share your run</title>
<meta name="description" content="Share your ChartRunner run.">
<meta property="og:title" content="ChartRunner - ride the chart">
<meta property="og:type" content="website">
<meta property="og:image" content="https://chartrunner.xyz/og-card.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://chartrunner.xyz/og-card.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
 :root{--ink:#030504;--paper:#F0EFE6;--signal:#57FF96}
 *{box-sizing:border-box} body{margin:0;background:var(--ink);color:var(--paper);
   font-family:'JetBrains Mono',ui-monospace,monospace;min-height:100vh;display:flex;
   flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
 canvas{width:100%;max-width:840px;height:auto;border:1px solid rgba(87,255,150,.25);box-shadow:0 0 40px rgba(87,255,150,.12)}
 .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
 button,a.btn{font-family:inherit;font-weight:800;font-size:15px;letter-spacing:.04em;cursor:pointer;
   border:2px solid var(--signal);background:transparent;color:var(--signal);padding:12px 20px;border-radius:10px;text-decoration:none}
 a.btn.play{background:var(--signal);color:var(--ink);border-color:var(--signal)}
 .hint{color:#7f8a86;font-size:13px}
</style></head><body>
<canvas id="card" width="1200" height="630" aria-label="ChartRunner share card"></canvas>
<div class="btns">
  <button id="dl">Download PNG</button>
  <button id="cp">Copy link</button>
  <a class="btn play" id="playBtn" href="/play">Play ChartRunner</a>
</div>
<div class="hint">chartrunner.xyz · in-game trades are simulated</div>
<script src="/assets/cr-share-card.js"></script>
<script>
 const q = new URLSearchParams(location.search);
 const opt = { type: q.get('type')||'general', value: q.get('v')||q.get('value')||'', sub: q.get('s')||q.get('sub')||'' };
 // v1.0.630 — if the share link carried a real deep-link (?to=, set via crShare's
 // o.url), send Play there instead of the bare /play — a shared room/racing/deeplink
 // card should land the viewer back in that room/run, not just the generic desktop.
 const to = q.get('to'); if (to){ try { document.getElementById('playBtn').href = to; } catch(_){} }
 const cv = document.getElementById('card');
 function draw(){ try{ CRShareCard.render(cv, opt); }catch(e){ console.error(e); } }
 // wait for webfonts, then draw (with a fallback timer)
 if (document.fonts && document.fonts.ready) {
   Promise.all([document.fonts.load('104px "Archivo Black"'), document.fonts.load('700 16px "JetBrains Mono"')])
     .then(()=>document.fonts.ready).then(draw);
   setTimeout(draw, 700);
 } else { setTimeout(draw, 300); }
 document.getElementById('dl').onclick = () => {
   const a = document.createElement('a');
   a.download = 'chartrunner-' + opt.type + '.png';
   a.href = cv.toDataURL('image/png'); a.click();
 };
 document.getElementById('cp').onclick = async (e) => {
   try { await navigator.clipboard.writeText(location.href); e.target.textContent = 'Copied!'; }
   catch { e.target.textContent = location.href; }
 };
</script>
</body></html>
